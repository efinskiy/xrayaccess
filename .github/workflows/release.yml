name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # создание GitHub Release
  packages: write   # push в ghcr.io

jobs:
  # ──────────────────────────────────────────
  # 1. Бинарники агента для Linux x86_64/arm64
  # ──────────────────────────────────────────
  build-agent:
    name: Build Agent Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum

      - name: Build linux/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
              -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
              -o ../dist/xray-agent-linux-amd64 \
              ./cmd/agent
        working-directory: agent

      - name: Build linux/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build \
              -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
              -o ../dist/xray-agent-linux-arm64 \
              ./cmd/agent
        working-directory: agent

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum xray-agent-linux-amd64 xray-agent-linux-arm64 > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: dist/

  # ──────────────────────────────────────────
  # 2. Docker образ сервера → ghcr.io
  # ──────────────────────────────────────────
  build-server:
    name: Build Server Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────
  # 3. Docker образ фронтенда → ghcr.io
  # ──────────────────────────────────────────
  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────
  # 4. GitHub Release — собирает всё вместе
  # ──────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-agent, build-server, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agent-binaries
          path: dist/

      - name: Copy extra files into dist
        run: |
          cp agent/xray-agent.service dist/
          cp agent/config.example.yaml dist/

      - name: Show artifacts
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/xray-agent-linux-amd64
            dist/xray-agent-linux-arm64
            dist/xray-agent.service
            dist/config.example.yaml
            dist/checksums.txt
          body_path: ${{ github.workspace }}/.github/release-notes-footer.md
